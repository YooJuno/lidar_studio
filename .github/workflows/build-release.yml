name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  metadata:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify release version rules
        run: |
          python3 tests/release_metadata_smoke.py
          python3 tests/release_publish_smoke.py
          python3 tests/macos_metadata_smoke.py
      - name: Resolve shared package version
        id: version
        run: python3 tools/release_metadata.py >> "$GITHUB_OUTPUT"

  ubuntu:
    name: Ubuntu 24.04 / ROS 2 Jazzy
    needs: metadata
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Configure pinned ROS 2 apt source
        run: |
          # Avoid the setup action's unauthenticated latest-release lookup.
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 120 -o /tmp/ros2-apt-source.deb \
            https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb
          echo 'f31d84adf5054c7d60ded0e82c0f776a77ea33af53d08f40b9ad7c94cca55296  /tmp/ros2-apt-source.deb' | sha256sum --check --strict
          sudo dpkg -i /tmp/ros2-apt-source.deb
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ninja-build libglfw3-dev libglew-dev libpcl-dev libnanoflann-dev libcurl4-openssl-dev libssl-dev \
            ros-jazzy-rosbag2-cpp ros-jazzy-sensor-msgs ros-jazzy-tf2-msgs ros-jazzy-rclcpp \
            ros-jazzy-rclpy ros-jazzy-rosbag2-py ros-jazzy-rmw-fastrtps-cpp ros-jazzy-rosbag2-storage-mcap ros-jazzy-rosbag2-storage-sqlite3 \
            zenity xvfb xauth x11-utils x11-xserver-utils libxtst6 ffmpeg \
            python3-pil python3-yaml python3-numpy libgl1-mesa-dri dpkg-dev
      - name: Configure
        run: |
          source /opt/ros/jazzy/setup.bash
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DLIDAR_VIEWER_ENABLE_CUDA=OFF -DLIDAR_VIEWER_ENABLE_ROSBAG=ON \
            -DLIDAR_VIEWER_USER_SETTINGS=ON -DCPACK_PACKAGE_VERSION="$RELEASE_VERSION"
      - name: Build and test
        run: |
          source /opt/ros/jazzy/setup.bash
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: CenterPoint feature, coordinate and NMS regressions
        run: /usr/bin/python3 tests/test_centerpoint.py --require-native
      - name: Verify original downloaded neural models on CPU
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/detector-test-config
          XDG_DATA_HOME: ${{ runner.temp }}/detector-test-data
        run: |
          python3 tools/setup_detector.py
          runtime="$XDG_DATA_HOME/lidar_viewer/detector/runtime/bin/python"
          "$runtime" tests/test_centerpoint.py --require-native --provider cpu --model short_range \
            --model-dir "$XDG_DATA_HOME/lidar_viewer/detector/centerpoint-shortrange-v2.0.0"
          "$runtime" tests/test_centerpoint.py --require-native --provider cpu --model tiny \
            --model-dir "$XDG_DATA_HOME/lidar_viewer/detector/centerpoint-tiny-v4.1"
      - name: Asynchronous detector playback and ROI GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_detector_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/detector
      - name: Visible model setup status and slow CPU detection GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_model_setup_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/model-setup
      - name: Kalman tracking, stable IDs and readable status GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_tracking_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/tracking
      - name: Recording list removal and restoration GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_source_removal_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/source-removal
      - name: Live pause, resume and recording GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_live_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/live
      - name: Ground ROI drawing, editing, undo and Apply GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_roi_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/roi
      - name: ROI dataset export, original intensity and IMU metadata GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_export_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/export
      - name: Dataset browser and asynchronous training controls GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          /usr/bin/python3 tests/training_adapter_smoke.py
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_dataset_training_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/dataset-training
      - name: In-app point review, sample deletion recovery and bag playback GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_point_review_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/point-review
      - name: Public example download and cached reopen GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_example_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/example
      - name: Ground-only and obstacles-only display GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_ground_view_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/ground-view
      - name: Independent display ROI and ground exclusion GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_exclusion_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/exclusions
      - name: Alignment manual fallback and reset GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_alignment_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/alignment
      - name: Playback continuity and direct ROI manipulation GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_playback_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/playback
      - name: Fixed navigation, inspector resize and BIN sequence GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_ux_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/ux
      - name: Panorama projection, depth, navigation and playback GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_panorama_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/panorama
      - name: Application settings persistence GUI test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          xvfb-run -a -s '-screen 0 1920x1200x24' /usr/bin/python3 tests/ui_app_settings_smoke.py \
            --viewer build/lidar_studio --output build/test_artifacts/app-settings
      - name: Package Ubuntu
        run: |
          source /opt/ros/jazzy/setup.bash
          cpack --config build/CPackConfig.cmake
      - name: Verify packaged preprocessing runtime
        run: cmake --build build --target check-native-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-Ubuntu
          path: |
            build/packages/*.deb
            build/packages/*.tar.gz
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-Ubuntu
          path: |
            build/Testing/Temporary/
            build/test_artifacts/

  portable:
    name: ${{ matrix.name }} / CPU
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows x64
          - os: macos-15
            name: macOS
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_MAX_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Get pinned vcpkg
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: 5363acb796e576328288fae60c25304e227e9839
          path: .vcpkg
      - name: Prepare Windows cache
        id: windows-cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
          $image = if ($env:ImageVersion) { $env:ImageVersion } else { 'windows-2022' }
          "image=$image" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Windows'
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-release-${{ steps.windows-cache.outputs.image }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}
          restore-keys: |
            vcpkg-windows-release-${{ steps.windows-cache.outputs.image }}-
            vcpkg-windows-release-
      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pcl glfw glew nanoflann ninja openssl@3
      - name: Prepare offline Mac detector and original models
        if: runner.os == 'macOS'
        run: python3 tools/bundle_macos_detector.py --output build-detector
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/cmake/triplets" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DLIDAR_VIEWER_ENABLE_CUDA=OFF -DLIDAR_VIEWER_ENABLE_ROSBAG=OFF `
            -DLIDAR_VIEWER_USER_SETTINGS=ON -DCPACK_PACKAGE_VERSION="$env:RELEASE_VERSION"
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DLIDAR_VIEWER_ENABLE_CUDA=OFF \
            -DLIDAR_VIEWER_ENABLE_ROSBAG=OFF -DLIDAR_VIEWER_USER_SETTINGS=ON -DCPACK_PACKAGE_VERSION="$RELEASE_VERSION" \
            -DLIDAR_STUDIO_BUNDLED_DETECTOR="$PWD/build-detector"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release
      - name: Verify packaged preprocessing runtime
        run: cmake --build build --target check-native-package --config Release
      - name: Verify extracted macOS app signature and GUI runtime
        if: runner.os == 'macOS'
        run: python3 tests/macos_package_smoke.py --packages build/packages --require-detector
      - name: Verify Windows package runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem build/packages/*.zip | Select-Object -First 1
          Expand-Archive -Path $package.FullName -DestinationPath build/package-smoke
          $viewer = Get-ChildItem build/package-smoke -Filter lidar_studio.exe -Recurse -File | Select-Object -First 1
          if (!$viewer) { throw 'Packaged viewer executable is missing' }
          foreach ($library in @('vcomp140.dll', 'vcruntime140.dll', 'msvcp140.dll')) {
            if (!(Test-Path (Join-Path $viewer.DirectoryName $library))) { throw "Missing runtime: $library" }
          }
          & $viewer.FullName --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged viewer exited with $LASTEXITCODE" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages-${{ runner.os }}
          path: |
            build/packages/*.zip
            build/packages/*.dmg
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-${{ runner.os }}
          path: |
            build/Testing/Temporary/
            .vcpkg/buildtrees/**/*.log
            build/CMakeFiles/CMakeConfigureLog.yaml
      - name: Preserve Windows dependency cache after a failed build
        if: failure() && runner.os == 'Windows'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-release-${{ steps.windows-cache.outputs.image }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}

  release:
    name: Publish GitHub release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, ubuntu, portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Verify packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 tools/publish_release.py --assets release-assets
